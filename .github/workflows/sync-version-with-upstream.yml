name: Update

on:
  # Runs at 10:00 UTC every day
  schedule:
    - cron:  '0 10 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: 🔄 Sync version with upstream
    environment: "Candidate Branch"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Sync version with upstream
        uses: snapcrafters/ci/sync-version@main
        with:
          token: ${{ secrets.SNAPCRAFTERS_BOT_COMMIT }}
          update-script: |
            # Update the snapcraft.yaml to match upstream version
            API="https://api.github.com/repos/jarun/ddgr/releases/latest"
            TAG=$(curl --fail --silent --show-error "${API}" |
              jq --exit-status --raw-output \
                '.tag_name | select(type == "string" and startswith("v") and length > 1)') || {
              echo "Unable to read a valid upstream release tag" >&2
              exit 1
            }
            VERSION=${TAG#v}
            sed -i 's/^\(version: \).*$/\1'"'$VERSION'"'/' snap/snapcraft.yaml
